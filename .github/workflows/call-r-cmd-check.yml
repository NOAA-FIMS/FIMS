# Runs R CMD CHECK on the package.
name: call-r-cmd-check

on:
  push:
    paths:
      - '.github/workflows/call-r-cmd-check.yml'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - 'R/**'
      - 'man/**'
      - 'tests/**'
      - 'inst/**'
      - 'data/**'
      - 'data-raw/**'
      - 'vignettes/**'
      - 'src/**'
      - 'README.md'
      - 'pkgdown/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # Rebuild against the runner's R/compiler rather than using the cached
      # macOS TMB binary that failed to resolve an OpenMP runtime symbol.
      - name: Rebuild TMB from source on macOS
        if: runner.os == 'macOS'
        shell: Rscript {0}
        run: install.packages("TMB", type = "source")

      - name: Verify TMB loads in a fresh R process
        shell: Rscript {0}
        run: |
          library(TMB)
          packageVersion("TMB")
          sessionInfo()

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          error-on: '"error"'
      - name: Show testthat output
        if: always()
        run: find check -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash
      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-r-release-results
          path: check
